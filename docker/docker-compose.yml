version: '3.8'

services:
  media-generation-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: media-generation-service
    ports:
      - "8045:8045"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/media
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - STABILITY_API_KEY=${STABILITY_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - LEONARDO_API_KEY=${LEONARDO_API_KEY}
      - REPLICATE_API_KEY=${REPLICATE_API_KEY}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - STORAGE_TYPE=${STORAGE_TYPE:-local}
      - MEDIA_STORAGE_ROOT=/app/media_storage
      - DEFAULT_IMAGE_SIZE=${DEFAULT_IMAGE_SIZE:-1024x1024}
      - DEFAULT_IMAGE_FORMAT=${DEFAULT_IMAGE_FORMAT:-png}
      - MAX_VIDEO_DURATION=${MAX_VIDEO_DURATION:-60}
      - DEBUG=${DEBUG:-false}
      - CONTENT_ENGINE_URL=http://content-engine:8040
      - MARKETING_AUTOMATION_URL=http://marketing-automation-engine:8039
    volumes:
      - media-storage:/app/media_storage
    depends_on:
      - postgres
      - redis
    networks:
      - media-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: media-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=media
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - media-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: media-redis
    networks:
      - media-network
    restart: unless-stopped

networks:
  media-network:
    driver: bridge

volumes:
  postgres-data:
  media-storage:
