version: '3.8'

services:
  media-generation-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: media-generation-service
    ports:
      - "8045:8045"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/media
      - REDIS_URL=redis://redis:6379/5
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - STABILITY_API_KEY=${STABILITY_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - LEONARDO_API_KEY=${LEONARDO_API_KEY}
      - REPLICATE_API_KEY=${REPLICATE_API_KEY}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - STORAGE_TYPE=${STORAGE_TYPE:-local}
      - MEDIA_STORAGE_ROOT=/app/media_storage
      - DEFAULT_IMAGE_SIZE=${DEFAULT_IMAGE_SIZE:-1024x1024}
      - DEFAULT_IMAGE_FORMAT=${DEFAULT_IMAGE_FORMAT:-png}
      - MAX_VIDEO_DURATION=${MAX_VIDEO_DURATION:-60}
      - DEBUG=${DEBUG:-false}
      - CONTENT_ENGINE_URL=http://content-engine:8040
      - MARKETING_AUTOMATION_URL=http://marketing-automation-engine:8039
    volumes:
      - media-storage:/app/media_storage
    # No depends_on here - postgres/redis moved to shared infra
    # (deploy/docker-compose.infra.yml), a different compose project.
    # Bring that up first: deploy/03-build-and-up.sh infra-up
    networks:
      - os42-shared
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8045/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  os42-shared:
    external: true

volumes:
  media-storage:
